name: Viewer (GitHub Pages)
# Called by ci.yml on main, only after the Python, web, router and infra jobs have all passed: a failing build never reaches the site.
# To publish by hand, run the CI workflow (Actions > CI > Run workflow) on main; it tests first, then calls this.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_VIEWER: "1"
          EVIDENCE_STRICT: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
          # the hosted Lab's address, a repository VARIABLE (Settings > Secrets and variables > Actions > Variables > PHOTO_BASE); empty = no photos
          VITE_PHOTO_BASE: ${{ vars.PHOTO_BASE }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # only this job may publish: write to Pages and get the short-lived OIDC token Pages checks
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false   # never cut a deploy off half-way; the next one waits
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
