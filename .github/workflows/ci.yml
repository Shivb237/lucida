name: CI
# Every push and pull request: Python tests, the web build (Lab and Viewer), the router tests, the infra checks (synth only, never a deploy).
# On main, when all four pass, the Viewer is published to GitHub Pages (pages.yml, called below), so a red build never reaches the site.
# Actions are pinned to full commit SHAs (the comment names the release); Dependabot (.github/dependabot.yml) proposes updates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # a newer push replaces an older run, except on main (a Pages deploy may be under way)
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      # CPU-only torch first, from PyTorch's own index and hash-checked (a plain PyPI torch on Linux pulls the CUDA build, several GB), the same
      # way space/Dockerfile does it. The main lock then finds torch==2.14.1 already satisfied by 2.14.1+cpu and installs the rest, hash-checked.
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps --index-url https://download.pytorch.org/whl/cpu -r space/requirements-torch-cpu.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      EVIDENCE_STRICT: "1"   # a summary file the Evidence page cannot read fails the build here (locally it is only a warning)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build (Lab)
        run: npm run build
      - name: Build (Viewer, what Pages publishes)
        run: npm run build
        env:
          VITE_VIEWER: "1"

  router:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 LTS: the tests import the .ts files directly (type stripping is on by default since Node 22.18 / 23.6). Not 25: it is an odd,
      # short-lived release, already past its end of life
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/router/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the machines run the compiled router on Node 22+ (nodejs24, else nodejs22, from Amazon Linux): check dist/ on the oldest of them too
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Smoke check of dist/ on Node 22
        run: npm run smoke

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # synth only, with a documentation IP (RFC 5737) and no AWS credentials: nothing is deployed or looked up
      - name: cdk synth
        run: npx cdk synth --no-notices -c myIp=203.0.113.7/32 > /dev/null

  pages:
    needs: [python, web, router, infra]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write      # the called workflow grants these to its deploy job only
      id-token: write
    uses: ./.github/workflows/pages.yml
